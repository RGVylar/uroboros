[project]
name = "uroboros-backend"
version = "0.1.0"
description = "Uroboros - self-hosted macro/calorie tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "email-validator>=2.2",
    "bcrypt<4.1",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "resend>=2.0",
    "pywebpush>=2.0",
    "apscheduler>=3.10",
    "slowapi>=0.1.9",
    "openpyxl>=3.1",
    # Reencodea las fotos de perfil. No es opcional: es lo que borra el EXIF
    # (incluido el GPS) y lo que impide que un SVG o un polyglot llegue a disco.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
