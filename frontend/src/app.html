<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Uroboros</title>
		<!-- Open Graph: la tarjeta que pintan WhatsApp/Telegram al compartir un enlace -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="uroboros" />
		<meta property="og:title" content="uroboros — come mejor, en pareja" />
		<meta property="og:description" content="La app para llevar la comida con tu pareja: registra una comida para los dos a la vez." />
		<meta property="og:image" content="https://comida.mugrelore.com/social-banner.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="/logo.png" type="image/png" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0d1117" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Uroboros" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
