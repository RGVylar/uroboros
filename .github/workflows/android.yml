name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build SvelteKit
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Generate Android icons
        working-directory: frontend
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          declare -A SIZES=(
            ["mdpi"]="48"
            ["hdpi"]="72"
            ["xhdpi"]="96"
            ["xxhdpi"]="144"
            ["xxxhdpi"]="192"
          )

          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"

            convert "static/logo.png" -resize "${size}x${size}" \
              -background none -gravity center -extent "${size}x${size}" \
              "$dir/ic_launcher.png"

            convert "static/logo.png" -resize "${size}x${size}" \
              -background none -gravity center -extent "${size}x${size}" \
              "$dir/ic_launcher_round.png"

            safe=$(echo "$size * 108 / 72" | bc)
            convert "static/logo.png" -resize "${size}x${size}" \
              -background none -gravity center -extent "${safe}x${safe}" \
              "$dir/ic_launcher_foreground.png"

            echo "✓ $density: ${size}px"
          done

          echo "All icons generated"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/uroboros-release.keystore

      - name: Build release AAB
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/uroboros-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: uroboros-release
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK to Nextcloud
        if: success()
        run: |
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          FILENAME="uroboros-debug-$(date +%Y%m%d-%H%M).apk"
          curl --fail --show-error -u "sGJbnegkQ4SapJo:" -T "$APK" \
            "https://files.mugrelore.com/public.php/dav/files/sGJbnegkQ4SapJo/${FILENAME}"
